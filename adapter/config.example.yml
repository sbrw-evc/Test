env: prod
poll_seconds: 30
port: 8000
sources:
  - component: teamcity
    url: https://teamcity.example.internal/
    token_env: TEAMCITY_TOKEN
    # ca_file: /ca/ca.crt
    request_timeout: 10
    max_pages: 50
    agents_minimum: 2
    queue_limit: 10
    expected_agents: [] # Stable agent IDs only; do not list ephemeral Pods.
    pipelines:
      - project: platform
        pipeline: backend-build
        build_type: Platform_BackendBuild
        timeout_seconds: 3600
  - component: jenkins
    url: https://jenkins.example.internal/
    user_env: JENKINS_USER
    token_env: JENKINS_TOKEN
    agents_minimum: 2
    queue_limit: 10
    max_pages: 50
    expected_agents: [] # Jenkins computer displayName.
    # agent_names: [linux-01, linux-02] # Optional subset; default excludes controller.
    pipelines:
      - project: platform
        pipeline: frontend-build
        job_path: job/platform/job/frontend/job/main
        timeout_seconds: 1800
  - component: octopus
    url: https://octopus.example.internal/
    token_env: OCTOPUS_API_KEY
    space: Spaces-1
    max_pages: 50
    queue_limit: 5
    pipelines:
      - project: platform
        pipeline: backend-prod
        project_id: Projects-1
        environment_id: Environments-1
        timeout_seconds: 1800
