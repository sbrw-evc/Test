apiVersion: 1
groups:
- orgId: 1
  name: CI/CD operational
  folder: CI/CD
  interval: 1m
  rules:
  - uid: cicd-teamcity-http-down
    title: 'CI/CD teamcity: Сервер HTTP недоступен'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: cicd-prometheus
      model:
        refId: A
        datasource:
          type: prometheus
          uid: cicd-prometheus
        expr: min(probe_success{job="cicd-blackbox",component="teamcity"}) or vector(0)
        instant: true
        range: false
        legendFormat: '{{component}} {{pod}} {{container}}'
    - refId: B
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: strict
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    for: 2m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      team: cicd
      component: teamcity
      severity: critical
    annotations:
      summary: Сервер HTTP недоступен
      description: Проверьте подробный dashboard и Query Inspector. Ошибка/NoData
        источника также требует внимания; это не подтверждённый сбой сборки.
      __dashboardUid__: cicd-operational-health
      __panelId__: '41'
    isPaused: false
  - uid: cicd-teamcity-api-check
    title: 'CI/CD teamcity: REST API: ошибка сбора / неверные права / неполный инвентарь'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: cicd-teamcity
      model:
        refId: A
        datasource:
          type: yesoreyeram-infinity-datasource
          uid: cicd-teamcity
        type: json
        source: url
        url: /app/rest/agents
        url_options:
          method: GET
          params:
          - key: locator
            value: defaultFilter:false,count:1000
          - key: fields
            value: nextHref,agent(id,name,connected,enabled,authorized)
        parser: jq-backend
        format: timeseries
        root_selector: "\ndef arr(k): if (.[k]|type)==\"array\" then .[k] else error(\"\
          Expected array: \" + k) end;\ndef epoch:\n  if . == null then null else\n\
          \  capture(\"^(?<y>[0-9]{4})-?(?<m>[0-9]{2})-?(?<d>[0-9]{2})T(?<h>[0-9]{2}):?(?<mi>[0-9]{2}):?(?<s>[0-9]{2})(?:\\\
          \\.[0-9]+)?(?<z>Z|[+-][0-9]{2}:?[0-9]{2})$$\") |\n  . as $$t | (($$t.y+\"\
          -\"+$$t.m+\"-\"+$$t.d+\"T\"+$$t.h+\":\"+$$t.mi+\":\"+$$t.s+\"Z\") | fromdateiso8601)\
          \ -\n  (if $$t.z==\"Z\" then 0 else (($$t.z[1:3]|tonumber)*3600 + ($$t.z|gsub(\"\
          :\";\"\")|.[3:5]|tonumber)*60) * (if $$t.z[0:1]==\"+\" then 1 else -1 end)\
          \ end)\n  end;\ndef point(v): {time:(now*1000|floor),value:v};\ndef complete_inventory(k):\
          \ if (.nextHref // \"\") != \"\" or ((.TotalResults // 0) > (.[k]|length))\
          \ then error(\"Inventory truncated: increase inventory_limit\") else arr(k)\
          \ end;\ndef mean: if length==0 then null else add/length end;\ncomplete_inventory(\"\
          agent\") | point(1)"
        columns:
        - selector: time
          text: Time
          type: timestamp_epoch
        - selector: value
          text: Value
          type: number
    - refId: B
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: strict
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    for: 2m
    noDataState: Alerting
    execErrState: Alerting
    labels:
      team: cicd
      component: teamcity
      severity: critical
    annotations:
      summary: 'REST API: ошибка сбора / неверные права / неполный инвентарь'
      description: Проверьте подробный dashboard и Query Inspector. Ошибка/NoData
        источника также требует внимания; это не подтверждённый сбой сборки.
      __dashboardUid__: cicd-operational-health
      __panelId__: '41'
    isPaused: false
  - uid: cicd-teamcity-failure
    title: 'CI/CD teamcity: Неуспешная сборка за последние 10 минут'
