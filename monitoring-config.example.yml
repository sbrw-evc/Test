# Alert scopes only. Dashboard dropdowns discover live API entities automatically.
teamcity_pipeline: '*'
jenkins_pipeline: '*'
octopus_space: Spaces-1
octopus_project: '*'
# No guessed Prod ID. Resolve it from environments API and unpause by regenerating.
prod_environment_id: __configure_prod__
queue_limit: 10
minimum_agents: 1
build_age_limit: 1800
deployment_age_limit: 3600
