groups:
- name: cicd-native
  interval: 30s
  rules:
  - record: ci:expected_component
    expr: vector(1)
    labels:
      env: prod
      component: teamcity
  - record: ci:expected_component
    expr: vector(1)
    labels:
      env: prod
      component: jenkins
  - record: ci:expected_component
    expr: vector(1)
    labels:
      env: prod
      component: octopus
  - record: ci:agents_online
    expr: max(agents_connected_authorized_number{job="teamcity",env="prod"})
    labels:
      env: prod
      component: teamcity
  - record: ci:agents_online
    expr: sum(default_jenkins_nodes_online{job="jenkins",env="prod",node=~"linux-.*"})
    labels:
      env: prod
      component: jenkins
  - record: ci:queue_length
    expr: max(builds_queued_number{job="teamcity",env="prod"})
    labels:
      env: prod
      component: teamcity
  - record: ci:queue_length
    expr: max(default_jenkins_executors_queue_length{job="jenkins",env="prod",label="linux"})
    labels:
      env: prod
      component: jenkins
  - record: ci:native_up
    expr: min(up{job="teamcity",env="prod"} and (time()-timestamp(up{job="teamcity",env="prod"})
      < 90))
    labels:
      env: prod
      component: teamcity
  - record: ci:native_up
    expr: min(up{job="jenkins",env="prod"} and (time()-timestamp(up{job="jenkins",env="prod"})
      < 90))
    labels:
      env: prod
      component: jenkins
  - record: ci:http_observed
    expr: min by (env, component) (probe_success{job="cicd-http"} and (time()-timestamp(probe_success{job="cicd-http"})
      < 90))
  - record: ci:http_up
    expr: ci:http_observed or on (env,component) ci:expected_component
  - record: ci:source_up
    expr: ci:native_up or on (env,component) ci:expected_component
  - record: ci:observed_down
    expr: clamp_max((1-ci:http_up) + on (env,component) (1-ci:source_up),1)
  - record: ci:observation_missing
    expr: (ci:expected_component unless on (env,component) ci:http_observed) or on
      (env,component) ((ci:expected_component{component!="octopus"} unless on (env,component)
      ci:native_up) or on (env,component) (ci:expected_component{component!="octopus"}
      unless on (env,component) ci:agents_online) or on (env,component) (ci:expected_component{component!="octopus"}
      unless on (env,component) ci:queue_length)) or on (env,component) (0*ci:expected_component)
  - record: ci:degraded
    expr: ((ci:queue_length{component="teamcity"} > bool 10) + on (env,component)
      (ci:agents_online{component="teamcity"} < bool 2)) > bool 0
    labels:
      env: prod
      component: teamcity
  - record: ci:degraded
    expr: ((ci:queue_length{component="jenkins"} > bool 10) + on (env,component) (ci:agents_online{component="jenkins"}
      < bool 2)) > bool 0
    labels:
      env: prod
      component: jenkins
  - record: ci:infrastructure_state
    expr: (1-ci:observed_down) * on (env,component) (3-2*ci:observation_missing-(1-ci:observation_missing)
      * on (env,component) (ci:degraded or on (env,component) (0*ci:expected_component)))
