apiVersion: 1
deleteRules:
- orgId: 1
  uid: cicd-capacity
- orgId: 1
  uid: cicd-native-scrape
groups:
- orgId: 1
  name: CI-CD Health
  folder: CI-CD Operations
  interval: 30s
  rules:
  - uid: cicd-server-down
    title: CI/CD · HTTP or API unavailable
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: critical
      team: platform
    annotations:
      summary: Observed HTTP/API check failed. API failure may also indicate credentials,
        permissions or an unavailable pipeline.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: 1 - ci:component_available
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-data-stale
    title: CI/CD · Data stale or incomplete
    condition: B
    for: 3m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      team: platform
    annotations:
      summary: No complete snapshot within 180 s, missing probe/exporter, or incomplete
        API pagination.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ci:data_stale
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-build-failed
    title: CI/CD · Last build failed
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      team: platform
    annotations:
      summary: Latest observed terminal result is failed or timed out. Resolves when
        a later terminal result replaces it. Polling can miss intermediate failures.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (ci_last_operation_status{operation="build"} == 2 or ci_last_operation_status{operation="build"}
          == 4) and on (env, component) (ci:data_stale == 0) and on (env, component)
          (ci:component_available == 1)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-deploy-failed
    title: CI/CD · Last deploy failed
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: critical
      team: platform
    annotations:
      summary: Latest observed terminal result is failed or timed out. Resolves when
        a later terminal result replaces it. Polling can miss intermediate failures.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (ci_last_operation_status{operation="deploy"} == 2 or ci_last_operation_status{operation="deploy"}
          == 4) and on (env, component) (ci:data_stale == 0) and on (env, component)
          (ci:component_available == 1)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-agent-down
    title: CI/CD · Expected agent unavailable
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      team: platform
    annotations:
      summary: Explicitly expected stable agent is missing, disconnected or disabled.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (1 - ci_resource_online) and on (env, component) (ci:data_stale == 0)
          and on (env, component) (ci:component_available == 1)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-agents-low
    title: CI/CD · Too few online agents
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      team: platform
    annotations:
      summary: Online agent count below configured minimum. Not a compatibility or
        free-slot guarantee.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (ci_agents_online < bool ci_agents_minimum) and on (env, component)
          (ci:data_stale == 0) and on (env, component) (ci:component_available ==
          1)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-queue-size
    title: CI/CD · Queue exceeds limit
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      team: platform
    annotations:
      summary: Selected-pipeline queue above configured limit.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (ci_queue_length > bool ci_queue_limit) and on (env, component) (ci:data_stale
          == 0) and on (env, component) (ci:component_available == 1)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-queue-age
    title: CI/CD · Queue waiting too long
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: critical
      team: platform
    annotations:
      summary: Oldest queued operation waiting longer than 15 min.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (ci_queue_oldest_age_seconds > bool 900) and on (env, component) (ci:data_stale
          == 0) and on (env, component) (ci:component_available == 1)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-long-build
    title: CI/CD · Build running too long
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      team: platform
    annotations:
      summary: Current build exceeds configured timeout.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (ci_running_elapsed_seconds{operation="build"} > bool ci_operation_timeout_seconds{operation="build"})
          and on (env, component) (ci:data_stale == 0) and on (env, component) (ci:component_available
          == 1)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-slow-http
    title: CI/CD · HTTP response too slow
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      team: platform
    annotations:
      summary: HTTP probe exceeds 2 s.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (probe_duration_seconds{job="cicd-http"} > bool 2) and (probe_success{job="cicd-http"}
          == 1)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
  - uid: cicd-rules-missing
    title: CI/CD · Recording rules missing
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      domain: cicd
      severity: critical
      team: platform
    annotations:
      summary: Expected component inventory rules missing.
      __dashboardUid__: cicd-health
      __panelId__: '2'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: absent(ci:expected_component{env="prod",component="teamcity"}) or absent(ci:expected_component{env="prod",component="jenkins"})
          or absent(ci:expected_component{env="prod",component="octopus"})
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
