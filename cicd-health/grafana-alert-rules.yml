          Expected array: \" + k) end;\ndef epoch:\n  if . == null then null else\n\
          \  (capture(\"^(?<y>[0-9]{4})-?(?<m>[0-9]{2})-?(?<d>[0-9]{2})T(?<h>[0-9]{2}):?(?<mi>[0-9]{2}):?(?<s>[0-9]{2})(?:\\\
          \\.[0-9]+)?(?<z>Z|[+-][0-9]{2}:?[0-9]{2})$\") // error(\"Invalid timestamp\"\
          )) |\n  . as $t | (($t.y+\"-\"+$t.m+\"-\"+$t.d+\"T\"+$t.h+\":\"+$t.mi+\"\
          :\"+$t.s+\"Z\") | fromdateiso8601) -\n  (if $t.z==\"Z\" then 0 else (($t.z[1:3]|tonumber)*3600\
          \ + ($t.z|gsub(\":\";\"\")|.[3:5]|tonumber)*60) * (if $t.z[0:1]==\"+\" then\
          \ 1 else -1 end) end)\n  end;\ndef point(v): {time:(now*1000|floor),value:v};\n\
          def complete_inventory(k): if (.nextHref // \"\") != \"\" or ((.TotalResults\
          \ // 0) > (.[k]|length)) then error(\"Inventory truncated: increase inventory_limit\"\
          ) else arr(k) end;\ndef mean: if length==0 then null else add/length end;\n\
          [arr(\"build\")[] | {id:(.id|tostring),workflow:.buildTypeId,status:(if\
          \ .state==\"running\" then \"RUNNING\" elif .canceledInfo != null then \"\
          CANCELED\" else .status end),start:(.startDate|epoch),finish:(.finishDate|epoch),duration:(if\
          \ .startDate!=null and .finishDate!=null then (.finishDate|epoch)-(.startDate|epoch)\
          \ else null end),url:.webUrl}] | point([.[] | select((.status==\"FAILURE\"\
          \ or .status==\"UNSTABLE\")) | select(.finish!=null and .finish>=(now-600)\
          \ and .finish<=now)]|length)"
        refId: A
        datasource:
          uid: bg0eecplputxce
          type: yesoreyeram-infinity-datasource
    - refId: R
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: R
        type: reduce
        expression: A
        reducer: last
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $R>0
