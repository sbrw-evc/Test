apiVersion: 1
deleteRules:
- orgId: 1
  uid: cicd-server-down
- orgId: 1
  uid: cicd-data-stale
- orgId: 1
  uid: cicd-build-failed
- orgId: 1
  uid: cicd-deploy-failed
- orgId: 1
  uid: cicd-agent-down
- orgId: 1
  uid: cicd-agents-low
- orgId: 1
  uid: cicd-capacity
- orgId: 1
  uid: cicd-queue-size
- orgId: 1
  uid: cicd-queue-age
- orgId: 1
  uid: cicd-long-build
- orgId: 1
  uid: cicd-slow-http
- orgId: 1
  uid: cicd-native-scrape
- orgId: 1
  uid: cicd-rules-missing
groups:
- orgId: 1
  name: CI-CD Native REST
  folder: CI-CD Operations
  interval: 60s
  rules:
  - uid: oss-service-down
    title: CI/CD · Server HTTP or scrape unavailable
    condition: B
    for: 2m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: critical
      env: prod
      team: platform
    annotations:
      summary: HTTP/readiness or authenticated native scrape failed.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ci:observed_down{env="prod"}
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-observation-missing
    title: CI/CD · Missing observations
    condition: B
    for: 3m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Expected probe/native KPI missing; do not treat missing as success.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ci:observation_missing{env="prod"}
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-tc-failed
    title: CI/CD · TeamCity last build failed
    condition: B
    for: 0s
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Latest selected terminal build is failure. Polling may miss fail→success
        between polls.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: teamcity-api
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        type: json
        source: url
        parser: backend
        format: table
        url: https://teamcity.example.internal/app/rest/builds?locator=buildType%3A%28id%3APlatform_BackendBuild%29%2Cstate%3Afinished%2CdefaultFilter%3Afalse%2Ccount%3A1&fields=count%2Cbuild%28id%2Cstatus%2CcanceledInfo%2CstartDate%2CfinishDate%2CwebUrl%29
        url_options:
          method: GET
        root_selector: '($exists(count) ? true : $error("Invalid TeamCity response");count>0
          and build[0].status="FAILURE" and ($not($exists(build[0].canceledInfo))
          or build[0].canceledInfo=null) ? 1 : 0)'
        columns: []
        datasource:
          type: yesoreyeram-infinity-datasource
          uid: teamcity-api
        pagination_mode: none
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-jenkins-failed
    title: CI/CD · Jenkins last build failed
    condition: B
    for: 0s
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Latest observed job result FAILURE; unstable/aborted distinct.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: default_jenkins_builds_last_build_result_ordinal{job="jenkins",env="prod",jenkins_job=~"platform/.*"}
          == bool 2
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-deploy-failed
    title: CI/CD · Octopus last deploy failed
    condition: B
    for: 0s
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: critical
      env: prod
      team: platform
    annotations:
      summary: Latest-created terminal Deploy task failed/timed out in configured
        project/environment.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: octopus-api
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        type: json
        source: url
        parser: backend
        format: table
        url: https://octopus.example.internal/api/Spaces-1/tasks?name=Deploy&project=Projects-1&environment=Environments-1&active=false&take=1
        url_options:
          method: GET
        root_selector: '($exists(TotalResults) and $exists(Items) ? true : $error("Invalid
          Octopus response");TotalResults>0 and Items[0].State in ["Failed","TimedOut"]
          ? 1 : 0)'
        columns: []
        datasource:
          type: yesoreyeram-infinity-datasource
          uid: octopus-api
        pagination_mode: none
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-octopus-api
    title: CI/CD · Octopus API unavailable
    condition: B
    for: 2m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: critical
      env: prod
      team: platform
    annotations:
      summary: Live REST query must return a valid tasks response. HTTP/auth/schema/query
        errors alert, even with dashboard closed.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: octopus-api
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        type: json
        source: url
        parser: backend
        format: table
        url: https://octopus.example.internal/api/Spaces-1/tasks?name=Deploy&project=Projects-1&environment=Environments-1&take=1
        url_options:
          method: GET
        root_selector: '($exists(TotalResults) and $exists(Items) ? true : $error("Invalid
          Octopus response");1)'
        columns: []
        datasource:
          type: yesoreyeram-infinity-datasource
          uid: octopus-api
        pagination_mode: none
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A < 1
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-tc-agent
    title: CI/CD · TeamCity expected agent unavailable
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Expected stable ID missing, disconnected, unauthorized or disabled.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: teamcity-api
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        type: json
        source: url
        parser: backend
        format: table
        url: https://teamcity.example.internal/app/rest/agents?locator=id%3A101%2CdefaultFilter%3Afalse&fields=count%2Cagent%28id%2Cconnected%2Cauthorized%2Cenabled%29
        url_options:
          method: GET
        root_selector: '($exists(count) ? true : $error("Invalid TeamCity response");count>0
          and agent[0].connected and agent[0].authorized and agent[0].enabled ? 1
          : 0)'
        columns: []
        datasource:
          type: yesoreyeram-infinity-datasource
          uid: teamcity-api
        pagination_mode: none
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A < 1
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-jenkins-agent
    title: CI/CD · Jenkins expected node unavailable
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Expected stable node offline. Missing node is separately detected by
        inventory alert.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: (default_jenkins_nodes_online{job="jenkins",env="prod",node="linux-01"}
          == bool 0) or vector(0)
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-jenkins-node-missing
    title: CI/CD · Jenkins expected node metric missing
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Expected stable node disappeared from plugin metrics.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: absent(default_jenkins_nodes_online{job="jenkins",env="prod",node="linux-01"})
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-teamcity-agents-low
    title: CI/CD · teamcity insufficient agents
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Online/connected agent count below configured minimum; not a compatibility
        guarantee.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ci:agents_online{env="prod",component="teamcity"}
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A < 2
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-teamcity-queue
    title: CI/CD · teamcity queue over limit
    condition: B
    for: 10m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: ''
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ci:queue_length{env="prod",component="teamcity"}
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 10
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-jenkins-agents-low
    title: CI/CD · jenkins insufficient agents
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Online/connected agent count below configured minimum; not a compatibility
        guarantee.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ci:agents_online{env="prod",component="jenkins"}
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A < 2
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-jenkins-queue
    title: CI/CD · jenkins queue over limit
    condition: B
    for: 10m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: ''
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: ci:queue_length{env="prod",component="jenkins"}
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 10
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-octopus-queue
    title: CI/CD · Octopus queue over limit
    condition: B
    for: 10m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: ''
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: octopus-api
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        type: json
        source: url
        parser: backend
        format: table
        url: https://octopus.example.internal/api/Spaces-1/tasks?name=Deploy&project=Projects-1&environment=Environments-1&states=Queued&take=1
        url_options:
          method: GET
        root_selector: '($exists(TotalResults) and $exists(Items) ? true : $error("Invalid
          Octopus response");TotalResults)'
        columns: []
        datasource:
          type: yesoreyeram-infinity-datasource
          uid: octopus-api
        pagination_mode: none
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 5
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-tc-long
    title: CI/CD · TeamCity build too long
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: ''
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: teamcity-api
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        type: json
        source: url
        parser: backend
        format: table
        url: https://teamcity.example.internal/app/rest/builds?locator=buildType%3A%28id%3APlatform_BackendBuild%29%2Cstate%3Arunning%2CdefaultFilter%3Afalse%2Ccount%3A100&fields=count%2CnextHref%2Cbuild%28id%2CstartDate%29
        url_options:
          method: GET
        root_selector: '($exists(count) ? true : $error("Invalid TeamCity response");$date
          := function($s){$toMillis($substring($s,0,4)&"-"&$substring($s,4,2)&"-"&$substring($s,6,2)&"T"&$substring($s,9,2)&":"&$substring($s,11,2)&":"&$substring($s,13,2)&$substring($s,15,3)&":"&$substring($s,18,2))};$exists(nextHref)
          ? $error("Running build page truncated") : count=0 ? 0 : $max(build.($millis()-$date(startDate)))/1000)'
        columns: []
        datasource:
          type: yesoreyeram-infinity-datasource
          uid: teamcity-api
        pagination_mode: none
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 3600
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-jenkins-long
    title: CI/CD · Jenkins build too long
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: Plugin may omit runtime when no builds are running; verify metric contract
        on installed version.
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: max(default_jenkins_builds_running_build_duration_milliseconds{job="jenkins",env="prod",jenkins_job=~"platform/.*"})/1000
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 3600
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-http-slow
    title: CI/CD · HTTP response too slow
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: warning
      env: prod
      team: platform
    annotations:
      summary: ''
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: probe_duration_seconds{job="cicd-http",env="prod"}
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 2
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
  - uid: oss-rules-missing
    title: CI/CD · Recording rules missing
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Alerting
    isPaused: false
    labels:
      domain: cicd
      severity: critical
      env: prod
      team: platform
    annotations:
      summary: ''
      __dashboardUid__: cicd-health
      __panelId__: '5'
    data:
    - refId: A
      datasourceUid: cicd-prometheus
      relativeTimeRange:
        from: 600
        to: 0
      model:
        refId: A
        expr: absent(ci:expected_component{env="prod",component="teamcity"}) or absent(ci:expected_component{env="prod",component="jenkins"})
          or absent(ci:expected_component{env="prod",component="octopus"})
        instant: true
        range: false
        format: time_series
        datasource:
          type: prometheus
          uid: cicd-prometheus
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        refId: B
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
        hide: false
